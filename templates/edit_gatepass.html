{% extends "layout.html" %}

{% block title %}
Create Gate Pass
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header">

        <h3 class="mb-0">
            Create Gate Pass
        </h3>

    </div>

    <div class="card-body">

        <form 
            method="POST"
            id="gatepassForm"
        >

            <!-- Row 1 -->

            <div class="row mb-3">

                <div class="col-md-4">

                    <label class="form-label">
                        Date*
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        name="gatepass_date"
                        id="gatepass_date"
                        value="{{ gate_pass.gatepass_date }}"
                        required
                    >

                </div>

                <div class="col-md-4">

                    <label class="form-label">
                        Section
                    </label>

                    <select class="form-select">

                        <option selected>
                            Infocom Services
                        </option>

                    </select>

                </div>

                <div class="col-md-4">

                    <label class="form-label">
                        Location*
                    </label>

                    <select
                        class="form-select"
                        name="location"
                        required
                    >   

                        <option>
                            Infocom
                        </option>

                        <option>
                            Avani Bhavan
                        </option>

                        <option>
                            Sabarmati
                        </option>

                    </select>

                </div>

            </div>

            <!-- Row 2 -->

            <div class="row mb-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Dispatched From*
                    </label>

                    <select
                        class="form-select"
                        name="dispatched_from"
                        id="dispatched_from"
                        required
                    >

                        <option>
                            Infocom-Infocom
                        </option>

                        <option>
                            Infocom-Avani Bhavan
                        </option>

                        <option>
                            Infocom-Sabarmati
                        </option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Dispatched To*
                    </label>

                    <select
                        class="form-select"
                        name="dispatched_to"
                        id="dispatched_to"
                        required
                    >

                        <option>
                            Infocom
                        </option>

                        <option>
                            Avani Bhavan
                        </option>

                        <option>
                            Sabarmati
                        </option>

                    </select>

                </div>

            </div>

            <!-- Row 3 -->

            <div class="row mb-3">

                <div class="col-md-4">

                    <label class="form-label">
                        Vehicle Type*
                    </label>

                    <select
                        class="form-select"
                        name="vehicle_type"
                        required
                    >

                        <option>
                            Two Wheeler
                        </option>

                        <option>
                            Four Wheeler
                        </option>

                        <option>
                            Heavy Vehicle
                        </option>

                        <option>
                            By Hand
                        </option>

                    </select>

                </div>

                <div class="col-md-4">

                    <label class="form-label">
                        Vehicle Number
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="vehicle_number"
                        value="{{ gate_pass.vehicle_number }}"
                        
                        style="text-transform: uppercase;"
                    >

                </div>

                <div class="col-md-4">

                    <label class="form-label">
                        E-Way Bill No.
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="eway_bill_no"
                        value="{{ gate_pass.eway_bill_no }}
                        
                    >

                </div>

            </div>

            <!-- Row 4 -->

            <div class="mb-3">

                <label class="form-label me-3">
                    Returnable
                </label>

                <input
                    type="radio"
                    name="returnable"
                    value="YES"
                >

                Yes

                <input
                    type="radio"
                    name="returnable"
                    value="NO"
                    class="ms-3"
                    checked
                >

                No

            </div>

            <!-- Row 5 -->

            <div class="row mb-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Approving Authority Name
                    </label>

                    <select
                        class="form-select"
                        name="approving_authority"
                        required
                    >

                        <option value="">
                            Select Approving Authority
                        </option>

                        <option>
                            Arun Gupta
                        </option>

                        <option>
                            Saurabh Gupta
                        </option>

                        <option>
                            Anip C Halpati
                        </option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Address To*
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="address_to"
                        value="{{ gate_pass.address_to }}"
                        required
                    >

                </div>

            </div>

            <!-- Row 6 -->

            <div class="row mb-4">

                <div class="col-md-6">

                    <label class="form-label">
                        Receiver CPF
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        name="receiver_cpf"
                        value="{{ gate_pass.reciever_cpf }}"
                        
                    >

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Receiving Name*
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="receiver_name"
                        value="{{ gate_pass.reciever_name }}"
                        required
                    >

                </div>

            </div>

            <hr>

            <h4 class="mb-3">
                Item Details
            </h4>

            <table class="table table-bordered">

                <thead class="table-light">

                    <tr>

                        <th>
                            Item No*
                        </th>

                        <th>
                            Material Description*
                        </th>

                        <th>
                            Asset / Serial No*
                        </th>

                        <th>
                            Qty*
                        </th>

                        <th>
                            Remarks*
                        </th>

                        <th>
                            Action*
                        </th>

                    </tr>

                </thead>

                <tbody id="itemTable">

                    <tr>

                        <td>

                            <input
                                type="text"
                                class="form-control"
                                name="item_no[]"
                                value="1"
                                required
                            >

                        </td>

                        <td>

                            <textarea
                            class="form-control"
                            name="material_description[]"
                            rows="1"
                            oninput="autoGrow(this)"
                            required></textarea>
                            

                        </td>

                        <td>

                            <input
                                type="text"
                                class="form-control"
                                name="asset_serial_no[]"
                                value="{{ gate_pass.asset_serial_no[] }}"
                                required
                            >

                        </td>

                        <td>

                            <input
                                type="number"
                                class="form-control"
                                name="qty[]"
                                min="1"
                                value="1"
                                required
                            >

                        </td>

                        <td>

                            <input
                                type="text"
                                class="form-control"
                                name="remarks[]"
                                value="{{ gate_pass.remarks[] }}"
                                required
                            >

                        </td>

                        <td>

                            <button
                                type="button"
                                class="btn btn-danger btn-sm"
                            >
                                X
                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

            <button
            type="button"
            class="btn btn-primary"
            onclick="addItem()"
            >
            + Add Item
            </button>

            <br>

            <button
                type="submit"
                class="btn btn-success"
            >
                Submit Gate Pass
            </button>

        </form>

    </div>

</div>
<script>

document
.getElementById(
    "gatepassForm"
)
.addEventListener(
    "submit",
    function(event){

        let fromLocation =
            document
            .getElementById(
                "dispatched_from"
            ).value;

        let toLocation =
            document
            .getElementById(
                "dispatched_to"
            ).value;

        if(
            fromLocation ===
            toLocation
        ){

            alert(
                "Dispatched From and Dispatched To cannot be same."
            );

            event.preventDefault();
        }

    }
);

</script>

<script>

let itemNo = document.querySelectorAll("#itemTable tr").length;

function renumberItems() {

    const rows = document.querySelectorAll("#itemTable tr");

    rows.forEach((row, index) => {

        row.querySelector(
            'input[name="item_no[]"]'
        ).value = index + 1;

    });

    itemNo = rows.length;
}

function checkDuplicateAssets() {

    const assets = document.querySelectorAll(
        'input[name="asset_serial_no[]"]'
    );

    const values = [];

    for (let asset of assets) {

        const value = asset.value.trim();

        if (
            value &&
            values.includes(value)
        ) {

            alert(
                "Duplicate Asset / Serial Number found!"
            );

            asset.focus();

            return false;
        }

        values.push(value);

    }

    return true;
}

function addItem() {

    itemNo++;

    const table = document.getElementById(
        "itemTable"
    );

    const row = table.insertRow();

    row.innerHTML = `

<td>

<input
type="number"
class="form-control"
name="item_no[]"
value="${itemNo}"
readonly
required>

</td>

<td>

<textarea
class="form-control"
name="material_description[]"
rows="1"
required
oninput="autoGrow(this)"
></textarea>

</td>

<td>

<input
type="text"
class="form-control"
name="asset_serial_no[]"
required>

</td>

<td>

<input
type="number"
class="form-control"
name="qty[]"
min="1"
value="1"
required>

</td>

<td>

<input
type="text"
class="form-control"
name="remarks[]">

</td>

<td>

<button
type="button"
class="btn btn-danger"
onclick="removeItem(this)"
>

X

</button>

</td>

`;

    attachEvents();

}

function removeItem(button){

    button.closest("tr").remove();

    renumberItems();

}

function autoGrow(textarea){

    textarea.style.height = "40px";

    textarea.style.height =
        textarea.scrollHeight + "px";

}

function attachEvents(){

    const rows = document.querySelectorAll(
        "#itemTable tr"
    );

    rows.forEach((row,index)=>{

        const inputs =
            row.querySelectorAll(
                "input,textarea"
            );

        inputs.forEach(input=>{

            input.onkeydown=function(e){

                if(
                    e.key==="Enter"
                ){

                    e.preventDefault();

                    if(
                        index===rows.length-1
                    ){

                        addItem();

                    }

                }

            };

        });

    });

}

document.querySelector("form").onsubmit=function(){

    return checkDuplicateAssets();

};

attachEvents();

</script>

<script>

const today = new Date()
    .toISOString()
    .split("T")[0];

const dateInput =
    document.getElementById(
        "gatepass_date"
    );

dateInput.min = today;

dateInput.value = today;

</script>

{% endblock %}
